<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="RotaNota transforma PDFs e materiais em uma rota personalizada para prova, prática e resultado.">
<title>RotaNota</title>
<link rel="icon" href="assets/rotanota-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ambient.css">
<link rel="stylesheet" href="css/premium.css">
</head>

<body>

<div id="ambientRoot"></div>
<div id="utilityRoot"></div>
<div id="shortcutHint" class="shortcut-hint" aria-live="polite" aria-hidden="true"></div>

<div id="customModal" class="custom-modal hidden">
  <div class="custom-box">
    <h2>Pomodoro Personalizado</h2>
    <div id="customRows" class="custom-rows"></div>
    <div class="custom-controls">
      <button class="row-btn right" onclick="Pomodoro.addCustomRow()">+</button>
      <button class="row-btn left" onclick="Pomodoro.removeCustomRow()">-</button>
    </div>
    <button class="save-btn" onclick="Pomodoro.saveCustom()">Salvar</button>
  </div>
</div>

<header class="topbar">
    <div class="topbar-left">
        <button id="homeBtn" class="icon-circle" title="Início" aria-label="Início">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 11.5L12 4l9 7.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6 10.5V20h12v-9.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <div class="rotanota-topbar-brand" aria-label="RotaNota">
            <img class="rotanota-topbar-mark" src="assets/rotanota-mark.svg" alt="" width="34" height="34">
            <img class="rotanota-topbar-logo rotanota-topbar-logo-light" src="assets/rotanota-logo-light.svg" alt="" width="162" height="42">
            <img class="rotanota-topbar-logo rotanota-topbar-logo-dark" src="assets/rotanota-logo-dark.svg" alt="" width="162" height="42">
        </div>
        <select id="timezoneSelector" class="timezone-topbar"></select>
    </div>

    <div class="topbar-right">
        <button id="printQtsBtn" class="icon-circle" title="Imprimir ou salvar PDF" aria-label="Imprimir ou salvar PDF">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M7 8V4h10v4" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="4" y="8" width="16" height="8" rx="2"/>
                <path d="M7 14h10v6H7z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button id="focusModeBtn" class="icon-circle" title="Modo imers&atilde;o (Shift + D)" aria-label="Modo imers&atilde;o (Shift + D)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="6"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-linecap="round"/>
            </svg>
        </button>
        <button id="fullscreenBtn" class="icon-circle" title="Tela cheia da tela atual (Shift + F)" aria-label="Tela cheia da tela atual (Shift + F)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button id="styleToggle" class="icon-circle" title="Estilo visual" aria-label="Estilo visual">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M12 3a9 9 0 1 0 9 9c0-.9-.7-1.5-1.5-1.5H17a2 2 0 0 1-2-2V6.5C15 5.7 14.3 5 13.5 5H12z" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="7.5" cy="10" r="1"/>
                <circle cx="9.5" cy="15" r="1"/>
                <circle cx="14.5" cy="15" r="1"/>
            </svg>
        </button>
        <button id="darkToggle" class="icon-circle" title="Modo escuro" aria-label="Modo escuro">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button data-module="questions" data-tier="primary" class="icon-circle footer-icon" data-label="Questões" title="Questões" aria-label="Questões">Q</button>
    </div>

    <button id="topbarCollapseBtn" class="topbar-collapse-btn" type="button" title="Recolher barra" aria-label="Recolher barra" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
</header>

<div id="sideModules" class="side-modules">
    <div class="side-group" data-nav-group="primary">
        <div class="side-group-label">Estudo</div>
        <div class="side-group-buttons"></div>
    </div>
    <div class="side-group" data-nav-group="utility">
        <div class="side-group-label">Ferramentas</div>
        <div class="side-group-buttons"></div>
    </div>
</div>

<section id="hero" class="hero">

    <div id="pomodoroPresets" class="pomodoro-presets"></div>

    <div class="date-display" id="dateDisplay"></div>

    <div class="time-display" id="timeDisplay">00:00:00</div>

    <div class="controls" id="controls">
        <button id="playBtn" class="control-btn" title="Iniciar">></button>
        <button id="pauseBtn" class="control-btn" title="Pausar">||</button>
        <button id="resetBtn" class="control-btn" title="Resetar">R</button>
    </div>

    <div id="cycleProgress" class="cycle-progress"></div>
    <section id="todayFlow" class="today-flow hidden" aria-live="polite"></section>

    <div class="main-stats-row">
        <div id="weeklyGoal" class="weekly-goal"></div>
        <div id="studyStats" class="study-stats"></div>
        <div id="levelSystem" class="level-system"></div>
    </div>

    <div id="streakVisual" class="streak-visual"></div>
    <div id="dailyGoal" class="daily-goal"></div>
    <div id="weeklyChart" class="weekly-chart"></div>
    <div id="sessionLog" class="session-log"></div>
    <div id="advancedStats" class="advanced-stats"></div>
    <div id="achievements" class="achievements"></div>
    <div id="progressiveBars" class="progressive-bars"></div>

    <div id="homeLaunchpad" class="home-launchpad">
        <section class="rotanota-home-brand" aria-label="RotaNota">
            <div class="rotanota-home-lockup">
                <img class="rotanota-home-logo" src="assets/rotanota-logo-dark.svg" alt="RotaNota" width="300" height="76">
            </div>
            <div>
                <strong>Seu material vira uma rota direta para a prova.</strong>
                <p>Carregue, organize, pratique e avance com foco no resultado.</p>
            </div>
        </section>

        <section class="home-immersion-entry" aria-label="Horario de imersao">
            <div class="home-immersion-copy">
                <span>Agora</span>
                <strong id="homeCompactTime">00:00</strong>
                <p id="homeCompactDate">Organize o ritmo antes de estudar.</p>
            </div>
            <button id="homeImmersionBtn" class="home-immersion-btn" type="button">
                Modo imers&atilde;o
            </button>
        </section>

        <div class="home-launchpad-main">
            <div class="launchpad-primary-grid">
                <button data-module="pomodoro" class="launchpad-card" type="button">
                    <span class="launchpad-card-title">Pomodoro</span>
                </button>

                <button data-module="qts" class="launchpad-card" type="button">
                    <span class="launchpad-card-title">Quadro semanal</span>
                </button>

                <button data-module="premium-study" class="launchpad-card" type="button">
                    <span class="launchpad-card-title">PDF Focado</span>
                </button>

                <button data-module="questions" class="launchpad-card" type="button">
                    <span class="launchpad-card-title">Questões</span>
                </button>
            </div>
        </div>

        <div class="home-launchpad-tools">
            <div class="launchpad-tool-row">
                <button data-module="stopwatch" class="launchpad-tool" type="button">Cronômetro</button>
                <button data-module="timer" class="launchpad-tool" type="button">Timer</button>
                <button data-module="calculator" class="launchpad-tool" type="button">Calculadora</button>
                <button data-module="calendar" class="launchpad-tool" type="button">Agenda</button>
            </div>
        </div>
    </div>

</section>

<main id="moduleArea">
    <section id="alarmModule" class="module"></section>
    <section id="calendarModule" class="module"></section>
    <section id="pomodoroModule" class="module"></section>
    <section id="qtsModule" class="module"></section>
    <section id="premium-studyModule" class="module"></section>
    <section id="questionsModule" class="module">
        <div id="questionsContainer"></div>
    </section>
</main>

<footer class="footer">

    <div class="footer-icons">
<button data-module="calendar" data-tier="utility" class="icon-circle footer-icon" data-label="Agenda">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<rect x="3" y="4" width="18" height="18" rx="2" />
<path d="M16 2v4M8 2v4M3 10h18" />
</svg>
</button>

<button data-module="stopwatch" data-tier="utility" class="icon-circle footer-icon" data-label="Cronômetro">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<circle cx="12" cy="13" r="8" />
<path d="M12 9v4l3 3M9 2h6" />
</svg>
</button>

<button data-module="timer" data-tier="utility" class="icon-circle footer-icon" data-label="Timer">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<circle cx="12" cy="13" r="8" />
<path d="M12 13l3-3M9 2h6" />
</svg>
</button>

<button data-module="calculator" data-tier="utility" class="icon-circle footer-icon" data-label="Calculadora">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<rect x="5" y="3" width="14" height="18" rx="2" />
<path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M16 15h0M8 19h2M12 19h2M16 19h0" />
</svg>
</button>

<button data-module="pomodoro" data-tier="primary" class="icon-circle footer-icon" data-label="Pomodoro">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<path d="M12 2C9 2 6 5 6 8s3 6 6 6 6-3 6-6-3-6-6-6z" />
<path d="M12 2v4" />
</svg>
</button>

<button data-module="qts" data-tier="primary" class="icon-circle footer-icon" data-label="Quadro semanal">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<rect x="3" y="3" width="7" height="7" />
<rect x="14" y="3" width="7" height="7" />
<rect x="14" y="14" width="7" height="7" />
<rect x="3" y="14" width="7" height="7" />
</svg>
</button>

<button data-module="premium-study" data-tier="primary" class="icon-circle footer-icon" data-label="PDF Focado">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<path d="M4 18L12 4l8 14" />
<path d="M8.5 13h7" />
<path d="M10.2 16h3.6" />
</svg>
</button>
    </div>

    <div class="donate-area">
        <a href="#" id="donateLink">Doar</a>
        <div class="no-ads">RotaNota livre de an&uacute;ncios e pop-ups.</div>
    </div>

    <div class="footer-divider"></div>

    <div id="worldCarousel" class="world-carousel"></div>

</footer>

<div id="youtubePlayer" style="display:none;"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script src="js/eventBus.js"></script>
<script src="js/clock.js"></script>
<script src="js/timer.js"></script>
<script src="js/alarm.js"></script>
<script src="js/calendar.js"></script>
<script src="js/pomodoro.js"></script>
<script src="js/qts.js"></script>
<script src="js/stats.js"></script>

<script src="ambient/ambientState.js"></script>
<script src="ambient/ambientYoutube.js"></script>
<script src="ambient/ambientUI.js"></script>
<script src="ambient/ambientKeyboard.js"></script>
<script src="ambient/ambientPlayer.js"></script>

<script src="js/utilityWindows.js"></script>
<script src="js/app.js"></script>

</body>
</html>
