<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RotaNota - QTS Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ambient.css">
<link rel="stylesheet" href="css/premium.css">
<link rel="stylesheet" href="css/qts-lab.css">
</head>

<body data-mode="qts" data-lab="qts">
<header class="topbar">
    <div class="topbar-left">
        <button class="icon-circle" type="button" aria-label="Início" title="Início">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 11.5L12 4l9 7.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6 10.5V20h12v-9.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <select class="timezone-topbar" aria-label="Fuso horário">
            <option selected>BR Brasília (Oficial)</option>
        </select>
    </div>

    <div class="topbar-right">
        <button id="printQtsBtn" class="icon-circle" type="button" aria-label="Imprimir quadro" title="Imprimir quadro">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M7 8V4h10v4" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="4" y="8" width="16" height="8" rx="2"/>
                <path d="M7 14h10v6H7z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button class="icon-circle" type="button" aria-label="Modo foco" title="Modo foco">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="6"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="icon-circle" type="button" aria-label="Tela cheia" title="Tela cheia">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button class="icon-circle" type="button" aria-label="Visual" title="Visual">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 12h4l2-4 3 8 2-4h7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button class="icon-circle" type="button" aria-label="Modo escuro" title="Modo escuro">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button class="icon-circle" type="button" aria-label="Voltar" title="Voltar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
</header>

<div id="sideModules" class="side-modules" aria-label="Atalhos laterais">
    <div class="side-group" data-nav-group="primary">
        <div class="side-group-label">Estudo</div>
        <div class="side-group-buttons">
            <button class="icon-circle" type="button" aria-label="Questões" title="Questões">Q</button>
            <button class="icon-circle" type="button" aria-label="Pomodoro" title="Pomodoro">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M12 2C9 2 6 5 6 8s3 6 6 6 6-3 6-6-3-6-6-6z" />
                    <path d="M12 2v4" />
                </svg>
            </button>
            <button class="icon-circle active-footer" type="button" aria-label="Quadro semanal" title="Quadro semanal">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="3" y="3" width="7" height="7" />
                    <rect x="14" y="3" width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" />
                    <rect x="3" y="14" width="7" height="7" />
                </svg>
            </button>
        </div>
    </div>
    <div class="side-group" data-nav-group="utility">
        <div class="side-group-label">Ferramentas</div>
        <div class="side-group-buttons">
            <button class="icon-circle" type="button" aria-label="Agenda" title="Agenda">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <path d="M16 2v4M8 2v4M3 10h18" />
                </svg>
            </button>
            <button class="icon-circle" type="button" aria-label="Cronômetro" title="Cronômetro">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <circle cx="12" cy="13" r="8" />
                    <path d="M12 9v4l3 3M9 2h6" />
                </svg>
            </button>
            <button class="icon-circle" type="button" aria-label="Timer" title="Timer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <circle cx="12" cy="13" r="8" />
                    <path d="M12 13l3-3M9 2h6" />
                </svg>
            </button>
            <button class="icon-circle" type="button" aria-label="Calculadora" title="Calculadora">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <rect x="5" y="3" width="14" height="18" rx="2" />
                    <path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M16 15h0M8 19h2M12 19h2M16 19h0" />
                </svg>
            </button>
        </div>
    </div>
</div>

<main id="moduleArea">
    <section id="qtsModule" class="module active"></section>
</main>

<aside id="qtsLabLegend" class="qts-lab-legend" aria-label="Legenda do laboratório"></aside>

<footer class="footer">
    <div class="donate-area">
        <a href="#" onclick="return false;">Doar</a>
        <div class="no-ads">Laboratório isolado do Quadro semanal.</div>
    </div>
    <div class="footer-divider"></div>
    <div class="lab-note">Este preview usa armazenamento próprio: <code>qts_lab_v1</code></div>
</footer>

<script src="js/qts-lab.js"></script>
<script src="js/qts-lab-hooks.js"></script>
</body>
</html>
