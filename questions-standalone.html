<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questions Solo | Study OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="questions/questions.css">
<style>
body.questions-standalone-page {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(191, 219, 254, 0.34), transparent 24%),
        radial-gradient(circle at top right, rgba(186, 230, 253, 0.28), transparent 22%),
        linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
}

.questions-standalone-shell {
    width: min(1280px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 32px 0 48px;
}

#questionsModule.questions-standalone-module {
    display: block;
}
</style>
</head>
<body class="questions-standalone-page" data-mode="questions" data-style="clarity">
<div id="utilityRoot"></div>
<main class="questions-standalone-shell">
    <section id="questionsModule" class="questions-standalone-module"></section>
</main>
<script src="questions/core.js"></script>
</body>
</html>
